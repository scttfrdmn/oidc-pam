# OIDC PAM Broker Configuration Example
# This file shows configuration options for the OIDC authentication broker

# Server configuration
server:
  socket_path: "/var/run/oidc-auth/broker.sock"
  log_level: "info"
  audit_log: "/var/log/oidc-auth/audit.log"
  read_timeout: "30s"
  write_timeout: "30s"

# OIDC Provider configuration
oidc:
  providers:
    # Example: Okta configuration
    - name: "okta-corporate"
      issuer: "https://company.okta.com"
      client_id: "0oa1b2c3d4e5f6g7h8i9"
      scopes: ["openid", "email", "groups"]
      
      # User attribute mapping
      user_mapping:
        username_claim: "email"
        # (#159) An email-shaped claim binds on its local part only when you ask for it
        # and pin the domains it may come from: with these settings alice@example.com can
        # log in as "alice", while alice@partner.example and root@anything cannot.
        # Replace example.com with your domain(s). Privileged accounts (uid < 1000)
        # are refused regardless; see authentication.allow_privileged_accounts.
        username_claim_strip_domain: true
        allowed_email_domains: ["example.com"]
        email_claim: "email"
        name_claim: "name"
        groups_claim: "groups"
        
      # Research computing features
      research_policies:
        enable_project_groups: false
        enable_institutional_validation: false
        enable_allocation_checking: false
        enable_data_use_agreements: false
        
      # Provider settings
      # priority orders providers when more than one can serve a login: 1 is the
      # most preferred, and a provider that omits it sorts last. Ties are broken
      # by name. See CONFIGURATION-GUIDE.md, "Multiple Providers and priority".
      priority: 1
      user_type: "corporate"
      enabled_for_login: true
      # verification_only: this provider may confirm an identity but must never
      # be the one a login is issued against.
      verification_only: false
      # require_id_token is the default, and is spelled out here only to say so: the
      # ID token is the only part of a token response that can be verified at all
      # (signature, aud, exp, nonce), and without one the identity comes from
      # /userinfo with nothing vouching for it but TLS and the bearer token. Set it
      # to false only for a provider that does not issue an ID token for the device
      # grant. See CONFIGURATION-GUIDE.md, "How Far the Provider Is Trusted".
      require_id_token: true

    # Example: Azure AD configuration  
    - name: "azure-corporate"
      issuer: "https://login.microsoftonline.com/your-tenant-id/v2.0"
      client_id: "12345678-1234-1234-1234-123456789abc"
      scopes: ["openid", "email", "https://graph.microsoft.com/User.Read"]
      
      user_mapping:
        username_claim: "preferred_username"
        email_claim: "email"
        name_claim: "name"
        groups_claim: "groups"
        
      # Lower preference than okta-corporate above: configured, but not selected
      # while a priority-1 provider is present.
      priority: 2
      user_type: "corporate"
      enabled_for_login: true

# Authentication policies
authentication:
  token_lifetime: "8h"
  refresh_threshold: "1h"
  max_concurrent_sessions: 10
  require_groups: ["linux-users"]
  
  # Network requirements
  #
  # require_tailscale and require_private_network are checked against the login's
  # source_ip. A login can legitimately have none — one at the physical console,
  # or one whose PAM_RHOST is a resolved hostname rather than an address — so
  # enabling either of them requires unknown_source_ip as well, saying what
  # happens to those: "deny" (fail closed) or "allow" (permitted, and audited as
  # network_requirement_waived). The broker refuses to start without it.
  network_requirements:
    require_tailscale: false
    validate_device_trust: false
    require_private_network: false
    # unknown_source_ip: "deny"
    
  # Resource-specific policies
  # A policy is selected by its NAME: "default" applies to every host, any other
  # name must match this host's name (exactly, or as a domain component, so
  # "production" matches "api.production.example.com" but not "prod-login-01").
  # A policy that matches no host never applies — the broker logs a warning
  # naming it at startup. Rename the tier that applies to these hosts to
  # "default", or name your hosts to match. Every matching policy applies:
  # require_groups is the union of all matches and the global setting.
  policies:
    production:
      require_groups: ["production-access", "senior-engineers"]
      require_device_trust: true
      max_session_duration: "4h"
      require_reauth_for_new_hosts: true
      audit_level: "detailed"
      
    staging:
      require_groups: ["developers", "qa-team"]
      max_session_duration: "8h"
      audit_level: "standard"
      
    development:
      require_groups: ["developers", "contractors"]
      max_session_duration: "12h"
      allow_untrusted_devices: true
      audit_level: "basic"

  # Risk-based policies
  risk_policies:
    - condition: "risk_score >= 70"
      action: "REQUIRE_ADDITIONAL_MFA"
      recommendation: "High risk detected, additional authentication required"
    - condition: "unusual_location AND after_hours"
      action: "REQUIRE_APPROVAL"
      recommendation: "Unusual access pattern detected"

# Security configuration
security:
  audit_enabled: true
  secure_token_storage: true
  require_pkce: true
  verify_audience: true
  require_auth_time: false
  max_token_age: "24h"
  clock_skew_tolerance: "5m"
  
  # Token encryption key — MUST be a base64-encoded 32-byte (256-bit) key.
  # Generate with:  oidc-admin gen-key   (or: openssl rand -base64 32)
  # The value is used directly as the AES-256 key (no passphrase stretching);
  # a passphrase or wrong-length value is rejected at startup.
  token_encryption_key: "REPLACE-with-output-of-oidc-admin-gen-key"
  
  # TLS verification
  tls_verification:
    skip_tls_verify: false
    # SHA-256 fingerprints that must appear in the provider's TLS chain. Empty
    # means the system trust store decides. (#170) This was `pin_certificates`,
    # which is not a setting the broker reads — a list of fingerprints, not a
    # boolean, and a wrong one refuses every connection to the provider.
    pinned_certificates: []
    # trusted_ca_bundle: "/etc/ssl/certs/company-ca.pem"  # replaces the system store

  # Rate limiting. max_requests_per_minute is the budget for *starting* an
  # authentication, per requested account — not a host-wide total, so traffic for
  # one account cannot deny logins to another. check_session polls are charged
  # against a separate budget 20x this size, so a login that has been allowed to
  # start can always finish polling.
  rate_limiting:
    max_requests_per_minute: 60
    max_concurrent_auths: 10

# Secrets from outside the file: a client_secret or token_encryption_key written
# as "env:VAR_NAME" or "file:/path/to/secret" is resolved at startup. (#170) The
# cloud: section that used to sit here — provider, auto_discovery, Parameter
# Store, Key Vault, Secret Manager — had no readers anywhere in the broker.

# Audit configuration
audit:
  enabled: true
  format: "json"
  retention_period: "7_years"
  
  # Audit events to log
  events:
    - "authentication_attempts"
    - "authorization_decisions"
    - "token_validation"
    - "configuration_changes"
    - "session_management"
    
  # Output destinations
  outputs:
    - type: "file"
      path: "/var/log/oidc-auth/audit.log"
      rotation: "daily"
      
    - type: "syslog"
      facility: "auth"
      severity: "info"
      
  # Compliance frameworks
  compliance_frameworks: ["SOC2", "PCI", "HIPAA"]
  
  # Additional metadata
  include_tailscale_metadata: false
  include_device_fingerprint: true
  include_network_path: false