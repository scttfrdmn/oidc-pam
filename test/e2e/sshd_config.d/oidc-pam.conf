# sshd settings for the harness. Debian's sshd_config includes this directory
# first, so these win over the defaults below it.

# The device flow reaches the user through PAM's conversation, which sshd only
# runs for keyboard-interactive.
UsePAM yes
KbdInteractiveAuthentication yes

# Nothing else may authenticate: if a password or a public key could let alice
# in, a case could pass without pam_oidc.so having agreed to anything.
PasswordAuthentication no
PubkeyAuthentication no
GSSAPIAuthentication no
PermitRootLogin no
PermitEmptyPasswords no

# The module waits for the device flow with the PAM conversation open, so the
# grace period has to outlast its timeout= (15s in pam-sshd) with room to spare.
LoginGraceTime 120

# Everything sshd knows about a failed login, on stderr, where
# `docker compose logs client` picks it up.
LogLevel DEBUG2
