name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25.10'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: |
          # Vet all non-PAM packages (PAM packages require CGO and PAM headers)
          # Note: cmd/pam-helper imports pkg/pam so it's also excluded
          go vet ./pkg/auth ./pkg/config ./pkg/policy ./pkg/security ./pkg/ssh ./internal/ipc ./cmd/broker ./cmd/oidc-admin

      - name: Run tests
        run: |
          # Run all non-PAM tests (PAM tests require Linux PAM libraries)
          go test -race -coverprofile=coverage.out -covermode=atomic \
            ./pkg/auth ./pkg/config ./pkg/policy ./pkg/security ./pkg/ssh ./internal/ipc

      - name: Check test coverage
        run: |
          go tool cover -func=coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25.10'
          cache: true

      - name: Install PAM development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libjson-c-dev

      - name: Build broker
        run: make build-broker

      - name: Build admin CLI
        run: make build-admin

      - name: Build PAM module
        run: make build-pam

      - name: Build PAM helper
        run: make build-helper

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25.10'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2
          # Lint only non-PAM packages (PAM packages require CGO and PAM development libraries)
          args: --timeout=5m ./pkg/auth/... ./pkg/config/... ./pkg/policy/... ./pkg/security/... ./pkg/ssh/... ./internal/... ./cmd/broker/... ./cmd/oidc-admin/...

  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25.10'
          cache: true

      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Run 'make fmt'"
            gofmt -s -l .
            exit 1
          fi

      - name: Check go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
