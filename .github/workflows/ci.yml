name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: |
          # cmd/pam-module is the only package that needs cgo; it is vetted and
          # tested in the separate `pam` job, which installs the PAM and json-c
          # development headers. pkg/pam and cmd/pam-helper are pure Go (#141) and
          # belong here.
          go vet ./pkg/auth ./pkg/config ./pkg/metrics ./pkg/pam ./pkg/security ./pkg/ssh \
            ./internal/adminapi ./internal/brokerclient ./internal/ipc \
            ./cmd/broker ./cmd/oidc-admin ./cmd/pam-helper

      - name: Run tests
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic \
            ./pkg/auth ./pkg/config ./pkg/metrics ./pkg/pam ./pkg/security ./pkg/ssh \
            ./internal/adminapi ./internal/brokerclient ./internal/ipc ./cmd/oidc-admin

      - name: Check test coverage
        run: |
          go tool cover -func=coverage.out

  pam:
    name: PAM (cgo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Install PAM development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libjson-c-dev

      # cmd/pam-module holds the C bridge and every cgo wrapper around it, so it
      # is the only package this job exists for. It must stay that way: the C has
      # to live in the package that is built as c-shared, or the module ships with
      # no PAM entry points in it (#140).
      - name: Run go vet
        run: go vet ./cmd/pam-module

      - name: Run tests
        run: go test -race ./cmd/pam-module/...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Install PAM development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libjson-c-dev

      - name: Build broker
        run: make build-broker

      - name: Build admin CLI
        run: make build-admin

      - name: Build PAM module
        run: make build-pam

      - name: Build PAM helper
        run: make build-helper

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Install PAM development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libjson-c-dev

      # One pin, read by everything that runs the linter: this job and
      # test/docker/Dockerfile.verify. Hardcoding it in each meant they could
      # drift, and a linter version is part of what "lint passes" means (#142).
      - name: Read the pinned golangci-lint version
        id: golangci
        run: echo "version=$(tr -d '[:space:]' < .golangci-version)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci.outputs.version }}
          # Every package, including the cgo/PAM ones (hence the headers above).
          args: --timeout=5m ./...

  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Run 'make fmt'"
            gofmt -s -l .
            exit 1
          fi

      - name: Check go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
