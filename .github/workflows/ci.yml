name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Called by release.yml so a tag publishes only what this workflow accepts.
  # Reuse, not a copy: a second hand-maintained definition of the test set drifts
  # from this one silently, and the release is the copy nobody watches (#214).
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true

      # ./... includes cmd/pam-module, the one cgo package, so this job needs the
      # PAM and json-c headers even though the `pam` job covers that package
      # specifically.
      - name: Install PAM development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libjson-c-dev

      - name: Verify dependencies
        run: go mod verify

      # Every package. The hand-curated list this replaced is how the PAM
      # packages went unvetted and untested for as long as they did (#113).
      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check test coverage
        run: |
          go tool cover -func=coverage.out

  macos:
    name: macOS (no PAM headers)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true

      # No PAM headers are installed here, deliberately: macOS has neither
      # <security/pam_ext.h> nor json-c, so any cgo that escapes cmd/pam-module's
      # //go:build linux constraint fails this job instead of only breaking for
      # contributors on a Mac (#141). Nothing else in the tree may need cgo.
      - name: Build
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  pam:
    name: PAM (cgo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Install PAM development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libjson-c-dev

      # cmd/pam-module holds the C bridge and every cgo wrapper around it, so it
      # is the only package this job exists for. It must stay that way: the C has
      # to live in the package that is built as c-shared, or the module ships with
      # no PAM entry points in it (#140). The `test` job's ./... covers this
      # package too; the overlap is deliberate, so a cgo break is reported as one.
      - name: Run go vet
        run: go vet ./cmd/pam-module

      - name: Run tests
        run: go test -race ./cmd/pam-module/...

  e2e:
    name: End-to-end (SSH + PAM)
    runs-on: ubuntu-latest
    # 20 minutes is well over the ~6 the suite takes, including both image
    # builds; it is here so a login that hangs past every deadline in the system
    # fails the job instead of occupying a runner for six hours.
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No Go, no PAM headers and no credentials needed on the runner: the
      # harness builds everything inside its own images, and the identity
      # provider it authenticates against is a fake it starts itself. Docker with
      # the compose plugin is preinstalled on ubuntu-latest.
      #
      # This is the only job that exercises what PAM makes of the module's return
      # codes in a real stack, which is where every serious defect this project
      # has shipped has lived: #120 (PAM_SUCCESS while the user was still
      # deciding), #140 (a .so with no pam_sm_* symbols in it), #150 (a device
      # flow abandoned on its first poll), #152 and #153. Each passed every unit
      # test on both sides of the boundary it broke.
      - name: Run the end-to-end harness
        run: ./test/e2e/run-tests.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Install PAM development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libjson-c-dev

      - name: Build broker
        run: make build-broker

      - name: Build admin CLI
        run: make build-admin

      - name: Build PAM module
        run: make build-pam

      - name: Build PAM helper
        run: make build-helper

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Install PAM development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libjson-c-dev

      # One pin, read by everything that runs the linter: this job and
      # test/docker/Dockerfile.verify. Hardcoding it in each meant they could
      # drift, and a linter version is part of what "lint passes" means (#142).
      - name: Read the pinned golangci-lint version
        id: golangci
        run: echo "version=$(tr -d '[:space:]' < .golangci-version)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci.outputs.version }}
          # Every package, including the cgo/PAM ones (hence the headers above).
          args: --timeout=5m ./...

  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Run 'make fmt'"
            gofmt -s -l .
            exit 1
          fi

      - name: Check go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # Reads the build graph for both GOOS values rather than the host, so it
      # catches a cgo leak here as well as in the macOS job — and names the
      # offending package instead of failing with a missing header.
      - name: Check the cgo quarantine
        run: ./scripts/check-cgo-quarantine.sh

      # #222: four places compiled pam_oidc.so and three of them did not inspect
      # the result, which a build with no PAM entry points in it does not report
      # (#140). scripts/build-pam-module.sh cannot finish without inspecting it, so
      # what has to stay true is that nothing else compiles the module — a second
      # producer is where the check gets forgotten again.
      - name: Check one script is the only producer of the PAM module
        run: ./scripts/check-pam-module-producers.sh

      # Every `uses:` in this directory must name a 40-hex commit SHA. A version
      # tag is mutable: whoever controls the action's repository can retarget it,
      # and the two references that were left unpinned sat between "build the PAM
      # module" and "publish it" (#221). This check is here so that is a build
      # failure rather than something an audit has to find again.
      - name: Check every action is pinned to a commit SHA
        run: |
          # Local reusable workflows (`uses: ./...`) resolve to this repository at
          # this commit, so there is no third-party tag to pin.
          unpinned=$(grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows/ \
            | grep -vE 'uses:[[:space:]]*\./' \
            | grep -vE 'uses:[[:space:]]*[^@]+@[0-9a-f]{40}([[:space:]]|$)' \
            || true)
          if [ -n "$unpinned" ]; then
            echo "::error::unpinned action reference(s) — pin each to a 40-hex commit SHA with a '# vX.Y.Z' comment:"
            echo "$unpinned"
            exit 1
          fi
          echo "All action references in .github/workflows/ are pinned to commit SHAs."

      # #214: `build` in release.yml needed only `verify-version`, which checks the
      # README badge and a CHANGELOG header — so a tag published binaries no test
      # had run against. Assert the gate is still wired, since removing one `needs`
      # entry restores the hole silently.
      - name: Check the release build stays gated on CI
        run: |
          uses=$(yq -r '.jobs.ci.uses // ""' .github/workflows/release.yml)
          if [ "$uses" != "./.github/workflows/ci.yml" ]; then
            echo "::error::release.yml has no 'ci' job calling ./.github/workflows/ci.yml (found: '${uses}')"
            exit 1
          fi
          # `needs` may be a string or a sequence; compare as JSON either way.
          needs=$(yq -o=json -I=0 '.jobs.build.needs' .github/workflows/release.yml)
          if ! printf '%s' "$needs" | grep -q '"ci"'; then
            echo "::error::release.yml's build job does not need the 'ci' job (needs: ${needs}). A tag would publish untested binaries."
            exit 1
          fi
          echo "release.yml's build job is gated on the CI workflow."

      # The installer and uninstaller decide, in shell, whether a host stays
      # loggable-in: #207 was an uninstaller that reduced /etc/pam.d/sshd to
      # `auth requisite pam_deny.so` and reported success. This exercises that
      # logic against a throwaway /etc/pam.d — no root, no PAM headers, nothing
      # installed — so the guard is not left to a reviewer's reading.
      - name: Check the installer PAM wiring
        run: ./test/scripts/test-pam-wiring.sh

      # #208 was pam_oidc.so being copied into /lib/security, a directory that
      # exists on no distribution this project supports; #241 was two unreferenced
      # build scripts that went on emitting an installer doing exactly that, long
      # after the shipped installer stopped. Those scripts are deleted, so this
      # check passes trivially today — it is here so the next copy of that line is a
      # build failure rather than something an operator discovers when a host stops
      # accepting logins.
      #
      # It fires only where something *writes* to the path — a copy, a mode change,
      # a mkdir, a redirect — or assigns it to a variable, and it sees inside a
      # heredoc because that is where both emitted installers hid it. Naming the
      # path in prose stays allowed: install-release.sh and install.sh explain why
      # it is wrong, uninstall.sh sweeps a stale module out of it, and a check that
      # forbade the explanation would get the explanation deleted instead of the
      # defect.
      - name: Check no script hardcodes /lib/security as the PAM module path
        run: |
          hardcoded=$(grep -rnE \
            -e '^[[:space:]]*(sudo[[:space:]]+)?(cp|mv|ln|install|rsync|chmod|chown|mkdir)([[:space:]]|$).*/lib/security' \
            -e '>[[:space:]]*"?/lib/security' \
            -e "^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*=[\"']?/lib/security" \
            scripts/ || true)
          if [ -n "$hardcoded" ]; then
            echo "::error::/lib/security is hardcoded as a write target in scripts/. PAM's module directory differs per distribution (#208, #241) — resolve it at runtime, as install-release.sh's resolve_pam_dir() does:"
            echo "$hardcoded"
            exit 1
          fi
          echo "No script writes to a hardcoded /lib/security."

      - name: Shellcheck the install scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/*.sh test/scripts/*.sh
