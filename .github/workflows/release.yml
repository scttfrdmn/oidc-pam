name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-latest
          - arch: arm64
            runs_on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25.10'
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libjson-c-dev

      - name: Set build variables
        id: vars
        run: |
          VERSION=${GITHUB_REF_NAME}
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          GIT_COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.buildDate=${BUILD_DATE} -X main.gitCommit=${GIT_COMMIT}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ldflags=${LDFLAGS}" >> "$GITHUB_OUTPUT"

      - name: Build broker (pure Go)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="${{ steps.vars.outputs.ldflags }}" \
            -o bin/oidc-auth-broker-linux-${{ matrix.arch }} \
            ./cmd/broker

      - name: Build admin CLI (pure Go)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="${{ steps.vars.outputs.ldflags }}" \
            -o bin/oidc-admin-linux-${{ matrix.arch }} \
            ./cmd/oidc-admin

      - name: Build PAM module (CGO)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          go build -buildmode=c-shared -trimpath -ldflags="${{ steps.vars.outputs.ldflags }}" \
            -o bin/pam_oidc.so-linux-${{ matrix.arch }} \
            ./cmd/pam-module
          rm -f bin/pam_oidc.so-linux-${{ matrix.arch }}.h

      - name: Build PAM helper (CGO)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          go build -trimpath -ldflags="${{ steps.vars.outputs.ldflags }}" \
            -o bin/oidc-pam-helper-linux-${{ matrix.arch }} \
            ./cmd/pam-helper

      - name: Create archive
        run: |
          VERSION=${{ steps.vars.outputs.version }}
          ARCH=${{ matrix.arch }}
          DIR=oidc-pam-${VERSION}-linux-${ARCH}
          mkdir -p ${DIR}
          cp bin/oidc-auth-broker-linux-${ARCH}  ${DIR}/oidc-auth-broker
          cp bin/oidc-admin-linux-${ARCH}         ${DIR}/oidc-admin
          cp bin/pam_oidc.so-linux-${ARCH}        ${DIR}/pam_oidc.so
          cp bin/oidc-pam-helper-linux-${ARCH}    ${DIR}/oidc-pam-helper
          cp -r configs                            ${DIR}/configs
          cp README.md DEPLOYMENT.md LICENSE       ${DIR}/
          # Ship the release installer at the archive root as install.sh so
          # consumers have a canonical entrypoint (see scripts/install-release.sh).
          cp scripts/install-release.sh            ${DIR}/install.sh
          chmod +x                                 ${DIR}/install.sh
          tar czf ${DIR}.tar.gz ${DIR}
          sha256sum ${DIR}.tar.gz > ${DIR}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            oidc-pam-*.tar.gz
            oidc-pam-*.tar.gz.sha256
          retention-days: 1

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          # Extract changelog entry for this version if present
          NOTES=$(awk "/^## \[?${VERSION#v}/,/^## /" CHANGELOG.md 2>/dev/null | head -n -1 || echo "Release ${VERSION}")
          gh release create "${VERSION}" \
            --title "oidc-pam ${VERSION}" \
            --notes "${NOTES}" \
            dist/*.tar.gz \
            dist/*.sha256
