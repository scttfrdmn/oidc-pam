name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify version sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check README badge and CHANGELOG match the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          fail=0

          # README version badge must equal the tag.
          badge=$(grep -oE 'badge/Version-[^-]+(\.[^-]+)*-blue' README.md | sed -E 's#badge/Version-(.*)-blue#\1#' | head -1)
          if [ "$badge" != "$VERSION" ]; then
            echo "::error::README version badge is '$badge' but the tag is '$VERSION'. Use scripts/release.sh to cut releases."
            fail=1
          fi

          # CHANGELOG must have a section header for this version.
          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section. Use scripts/release.sh to cut releases."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Version $VERSION is consistent across the tag, README badge, and CHANGELOG."

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    needs: verify-version

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-latest
          - arch: arm64
            runs_on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libjson-c-dev

      - name: Set build variables
        id: vars
        run: |
          VERSION=${GITHUB_REF_NAME}
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          GIT_COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.buildDate=${BUILD_DATE} -X main.gitCommit=${GIT_COMMIT}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ldflags=${LDFLAGS}" >> "$GITHUB_OUTPUT"

      - name: Build broker (pure Go)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="${{ steps.vars.outputs.ldflags }}" \
            -o bin/oidc-auth-broker-linux-${{ matrix.arch }} \
            ./cmd/broker

      - name: Build admin CLI (pure Go)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="${{ steps.vars.outputs.ldflags }}" \
            -o bin/oidc-admin-linux-${{ matrix.arch }} \
            ./cmd/oidc-admin

      - name: Build PAM module (CGO)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          go build -buildmode=c-shared -trimpath -ldflags="${{ steps.vars.outputs.ldflags }}" \
            -o bin/pam_oidc.so-linux-${{ matrix.arch }} \
            ./cmd/pam-module
          rm -f bin/pam_oidc.so-linux-${{ matrix.arch }}.h

      # A c-shared build with no PAM entry points in it exits 0 (#140), so the
      # artifact has to be inspected before it can be released. This step is what
      # stops another release shipping a module PAM cannot use.
      - name: Verify the PAM module is loadable
        run: ./scripts/verify-pam-module.sh bin/pam_oidc.so-linux-${{ matrix.arch }}

      - name: Build PAM helper (CGO)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          go build -trimpath -ldflags="${{ steps.vars.outputs.ldflags }}" \
            -o bin/oidc-pam-helper-linux-${{ matrix.arch }} \
            ./cmd/pam-helper

      - name: Create archive
        run: |
          VERSION=${{ steps.vars.outputs.version }}
          ARCH=${{ matrix.arch }}
          DIR=oidc-pam-${VERSION}-linux-${ARCH}
          mkdir -p ${DIR}
          cp bin/oidc-auth-broker-linux-${ARCH}  ${DIR}/oidc-auth-broker
          cp bin/oidc-admin-linux-${ARCH}         ${DIR}/oidc-admin
          cp bin/pam_oidc.so-linux-${ARCH}        ${DIR}/pam_oidc.so
          cp bin/oidc-pam-helper-linux-${ARCH}    ${DIR}/oidc-pam-helper
          cp -r configs                            ${DIR}/configs
          cp README.md DEPLOYMENT.md LICENSE       ${DIR}/
          # Ship the release installer at the archive root as install.sh so
          # consumers have a canonical entrypoint (see scripts/install-release.sh).
          cp scripts/install-release.sh            ${DIR}/install.sh
          chmod +x                                 ${DIR}/install.sh
          tar czf ${DIR}.tar.gz ${DIR}
          sha256sum ${DIR}.tar.gz > ${DIR}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            oidc-pam-*.tar.gz
            oidc-pam-*.tar.gz.sha256
          retention-days: 1

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          # Extract changelog entry for this version if present
          NOTES=$(awk "/^## \[?${VERSION#v}/,/^## /" CHANGELOG.md 2>/dev/null | head -n -1 || echo "Release ${VERSION}")
          gh release create "${VERSION}" \
            --title "oidc-pam ${VERSION}" \
            --notes "${NOTES}" \
            dist/*.tar.gz \
            dist/*.sha256
