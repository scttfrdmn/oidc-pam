name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify version sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check README badge and CHANGELOG match the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          fail=0

          # README version badge must equal the tag.
          badge=$(grep -oE 'badge/Version-[^-]+(\.[^-]+)*-blue' README.md | sed -E 's#badge/Version-(.*)-blue#\1#' | head -1)
          if [ "$badge" != "$VERSION" ]; then
            echo "::error::README version badge is '$badge' but the tag is '$VERSION'. Use scripts/release.sh to cut releases."
            fail=1
          fi

          # CHANGELOG must have a section header for this version.
          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section. Use scripts/release.sh to cut releases."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Version $VERSION is consistent across the tag, README badge, and CHANGELOG."

  # A tag push used to publish a release with no test, lint or e2e job having run:
  # `build` needed only `verify-version`, which reads two files (#214). This calls
  # the CI workflow rather than restating its jobs, because two hand-maintained
  # copies of the test set drift and the drift is silent — the release would keep
  # passing a weaker gate than every pull request has to clear.
  #
  # `contents: read` is deliberately narrower than this workflow's `contents:
  # write`: nothing CI does needs to write, and a called workflow may only be
  # granted permissions the caller already has.
  ci:
    name: CI
    needs: verify-version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    needs: [verify-version, ci]

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-latest
          - arch: arm64
            runs_on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libjson-c-dev

      - name: Set build variables
        id: vars
        run: |
          VERSION=${GITHUB_REF_NAME}
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          GIT_COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.buildDate=${BUILD_DATE} -X main.gitCommit=${GIT_COMMIT}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ldflags=${LDFLAGS}" >> "$GITHUB_OUTPUT"

      - name: Build broker (pure Go)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="${{ steps.vars.outputs.ldflags }}" \
            -o bin/oidc-auth-broker-linux-${{ matrix.arch }} \
            ./cmd/broker

      - name: Build admin CLI (pure Go)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="${{ steps.vars.outputs.ldflags }}" \
            -o bin/oidc-admin-linux-${{ matrix.arch }} \
            ./cmd/oidc-admin

      - name: Build PAM module (CGO)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          go build -buildmode=c-shared -trimpath -ldflags="${{ steps.vars.outputs.ldflags }}" \
            -o bin/pam_oidc.so-linux-${{ matrix.arch }} \
            ./cmd/pam-module
          rm -f bin/pam_oidc.so-linux-${{ matrix.arch }}.h

      # A c-shared build with no PAM entry points in it exits 0 (#140), so the
      # artifact has to be inspected before it can be released. This step is what
      # stops another release shipping a module PAM cannot use.
      - name: Verify the PAM module is loadable
        run: ./scripts/verify-pam-module.sh bin/pam_oidc.so-linux-${{ matrix.arch }}

      - name: Build PAM helper (CGO)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          go build -trimpath -ldflags="${{ steps.vars.outputs.ldflags }}" \
            -o bin/oidc-pam-helper-linux-${{ matrix.arch }} \
            ./cmd/pam-helper

      - name: Create archive
        run: |
          VERSION=${{ steps.vars.outputs.version }}
          ARCH=${{ matrix.arch }}
          DIR=oidc-pam-${VERSION}-linux-${ARCH}
          mkdir -p ${DIR}
          cp bin/oidc-auth-broker-linux-${ARCH}  ${DIR}/oidc-auth-broker
          cp bin/oidc-admin-linux-${ARCH}         ${DIR}/oidc-admin
          cp bin/pam_oidc.so-linux-${ARCH}        ${DIR}/pam_oidc.so
          cp bin/oidc-pam-helper-linux-${ARCH}    ${DIR}/oidc-pam-helper
          cp -r configs                            ${DIR}/configs
          cp README.md DEPLOYMENT.md LICENSE       ${DIR}/
          # Ship the release installer at the archive root as install.sh so
          # consumers have a canonical entrypoint (see scripts/install-release.sh).
          cp scripts/install-release.sh            ${DIR}/install.sh
          chmod +x                                 ${DIR}/install.sh
          tar czf ${DIR}.tar.gz ${DIR}
          sha256sum ${DIR}.tar.gz > ${DIR}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            oidc-pam-*.tar.gz
            oidc-pam-*.tar.gz.sha256
          retention-days: 1

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: dist/

      # The .sha256 files are computed in the build job, before the upload, but
      # until now nothing re-checked them after the download — so anything that
      # substituted an artifact between the two steps went undetected (#221). The
      # checksums are only evidence if something compares them.
      - name: Verify artifact checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          sums=(*.tar.gz.sha256)
          tars=(*.tar.gz)
          # `sha256sum -c` over an empty file list exits 0, so an upload that
          # produced nothing would otherwise verify clean. Count first.
          if [ "${#sums[@]}" -eq 0 ] || [ "${#tars[@]}" -eq 0 ]; then
            echo "::error::dist/ has ${#tars[@]} tarball(s) and ${#sums[@]} checksum file(s); expected at least one of each"
            exit 1
          fi
          if [ "${#sums[@]}" -ne "${#tars[@]}" ]; then
            echo "::error::${#tars[@]} tarball(s) but ${#sums[@]} checksum file(s) in dist/ — an artifact is unaccounted for"
            exit 1
          fi
          sha256sum -c "${sums[@]}"
          echo "Verified ${#tars[@]} artifact(s) against their checksums."

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          # This version's CHANGELOG section, from its header to the next one. An
          # awk range cannot express that: the version header also matches the end
          # pattern, so the range closed on the line that opened it, and every
          # release up to v0.4.2 was published with empty notes.
          awk -v ver="${VERSION#v}" '
            index($0, "## [" ver "]") == 1 { inSection = 1; next }
            inSection && /^## / { exit }
            inSection { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::no CHANGELOG section for ${VERSION}" >&2
            echo "Release ${VERSION}" > release-notes.md
          fi
          gh release create "${VERSION}" \
            --title "oidc-pam ${VERSION}" \
            --notes-file release-notes.md \
            dist/*.tar.gz \
            dist/*.sha256
